<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng link...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f7fe; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; padding: 30px; border-radius: 16px; text-align: center; max-width: 400px; width: 90%; }
        .ad-box { background: #eef2f6; border: 2px dashed #cbd5e1; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .btn { background-color: #4318ff; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; display: none; }
    </style>
    <!-- Mã quảng cáo Adsterra trong thẻ head -->
    <script src="https://pl30863572.effectivecpmnetwork.com/40/44/45/404445d1f24ef7f1cdef2f14a2b2bf2e.js"></script>
</head>
<body>
    <div class="card">
        <h2>VUI LÒNG CHỜ...</h2>
        <div class="ad-box">
            <!-- Mã quảng cáo Adsterra trong khung -->
            <script src="https://pl30863572.effectivecpmnetwork.com/40/44/45/404445d1f24ef7f1cdef2f14a2b2bf2e.js"></script>
        </div>
        <div id="timer-box" style="font-size: 30px; font-weight: bold;">10</div>
        <button id="get-link-btn" class="btn" onclick="redirectNow()">LẤY LINK NGAY</button>
    </div>
    <script>
        let timeLeft = 10;
        let urlParams = new URLSearchParams(window.location.search);
        let destinationUrl = urlParams.get('url') || "https://google.com";
        const timerElement = document.getElementById('timer-box');
        const btnElement = document.getElementById('get-link-btn');
        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.style.display = 'none';
                btnElement.style.display = 'block';
            }
        }, 1000);
        function redirectNow() { window.location.href = destinationUrl; }
    </script>
</body>
</html>

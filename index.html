<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng link...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f7fe; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); max-width: 450px; width: 100%; text-align: center; }
        .ad-box { background: #eef2f6; border: 2px dashed #cbd5e1; padding: 20px; border-radius: 8px; margin: 15px 0; min-height: 150px; display: flex; align-items: center; justify-content: center; }
        .btn { background-color: #4318ff; color: white; border: none; padding: 14px 28px; font-size: 16px; border-radius: 8px; display: none; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>VUI LÒNG CHỜ...</h2>
        <div class="ad-box">[Dán mã quảng cáo của bạn tại đây]</div>
        <div id="timer-box" style="font-size: 30px; font-weight: bold; margin: 10px; color: #4318ff;">64</div>
        <button id="get-link-btn" class="btn" onclick="redirectNow()">LẤY LINK NGAY</button>
    </div>
    <script>
        let timeLeft = 64;
        let urlParams = new URLSearchParams(window.location.search);
        let destinationUrl = urlParams.get('url') || "https://google.com";
        const timerElement = document.getElementById('timer-box');
        const btnElement = document.getElementById('get-link-btn');
        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.style.display = 'none';
                btnElement.style.display = 'block';
            }
        }, 1000);
        function redirectNow() { window.location.href = destinationUrl; }
    </script>
</body>
</html>
